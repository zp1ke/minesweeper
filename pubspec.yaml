name: minezweeper
description: MineSweeper Game.
publish_to: 'none'

version: 1.2.0+11

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: 3.50.1

dependencies:
  cloud_firestore: ^7.2.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_crashlytics: ^6.1.0
  flex_color_scheme: ^9.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.5.0
  font_awesome_flutter: ^11.0.0
  google_fonts: ^9.0.0
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6

dev_dependencies:
  # Pins the formatter `dart format` uses (it honors the project-resolved
  # dart_style). Without it, transitive deps decide the formatting style.
  dart_style: ^3.1.14
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - asset/png/
    - asset/google_font/
  generate: true
  uses-material-design: true

flutter_native_splash:
  color: "#e89ca1"
  image: asset/png/logo.png
  color_dark: "#a26457"
  image_dark: asset/png/logo.png
