name: Build & Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Install Dependencies
        run: flutter pub get

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Create Android key properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          umask 077
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD" > android/key.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> android/key.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> android/key.properties
          printf 'storeFile=keystore.jks\n' >> android/key.properties

      - name: Build Android Bundle
        run: flutter build appbundle

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Releases
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          version=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "1.1.0+10" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip GitHub Release for the Play versionCode
        if: steps.version.outputs.publish != 'true'
        run: |
          echo "pubspec version is 1.1.0+10, already on Play. Artifacts were uploaded. No tag and no GitHub Release."

      - name: Check if version tag exists
        if: steps.version.outputs.publish == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Modify version tag if it exists
        if: steps.version.outputs.publish == 'true' && env.TAG_EXISTS == 'true'
        run: |
          echo "VERSION=${{ steps.version.outputs.version }}-build-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Set release tag
        if: steps.version.outputs.publish == 'true' && env.TAG_EXISTS != 'true'
        run: echo "VERSION=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Create Release
        if: steps.version.outputs.publish == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          tag: ${{ env.VERSION }}
